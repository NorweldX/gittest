name: CI                              # просто название пайплайна, для галочки в интерфейсе
on: [push]                            # ТРИГГЕР — "запускай при каждом push", аналог часового пояса в cron, только событие вместо времени
jobs:
  shellcheck:                         # имя задачи (можно любое)
    runs-on: ubuntu-latest            # на какой "чистой" виртуалке выполнять — GitHub сам выделяет её на минуту, потом удаляет
    steps:
      - uses: actions/checkout@v4     # шаг 1: скопировать твой репозиторий на эту виртуалку
      - run: shellcheck backup_and_check.sh   # шаг 2: обычная команда терминала — та же самая, что ты бы ввёл руками
